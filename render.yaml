services:
  - type: web
    name: stride-web-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stride-db
          property: connectionString

databases:
  - name: stride-db
    databaseName: stride
    user: stride_user
