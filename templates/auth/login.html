{% extends "base.html" %}

{% block title %}Sign In - Stride{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="figma-card-white p-8 shadow-xl border border-gray-100 rounded-3xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-[#0F172A] text-white flex items-center justify-center mx-auto mb-4 shadow-lg">
                <img src="{{ url_for('static', filename='images/icon.webp') }}" alt="Stride Logo" class="w-10 h-10 object-contain">
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Welcome to Stride</h1>
            <p class="text-xs text-gray-500">Manage your attendance, expenses, assignments & progress</p>
        </div>

        <!-- Google Sign-In Button -->
        <div class="mb-6">
            <button id="btn-google-login" onclick="signInWithGoogle()" 
                    class="w-full py-3.5 px-4 bg-white hover:bg-gray-50 text-gray-800 font-semibold rounded-2xl text-sm border border-gray-300 shadow-sm flex items-center justify-center gap-3 transition-all hover:shadow-md active:scale-98">
                <!-- Google G Logo SVG -->
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
        </div>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-xs text-gray-400 font-semibold uppercase">Or with Username</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Mode Tabs -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-[#0F172A] text-[#0F172A] transition-colors">
                Sign In
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors">
                Create Account
            </button>
        </div>

        <!-- Login Form -->
        <form id="form-login" action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" name="username" required placeholder="demo_user" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none text-sm transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none text-sm transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-[#0F172A] hover:bg-black text-white font-semibold rounded-2xl text-sm shadow-md transition-all active:scale-98">
                Sign In
            </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" action="{{ url_for('auth.register') }}" method="POST" class="space-y-5 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" name="username" required placeholder="john_doe" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none text-sm transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input type="email" name="email" required placeholder="john@example.com" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none text-sm transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none text-sm transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-[#0F172A] hover:bg-black text-white font-semibold rounded-2xl text-sm shadow-md transition-all active:scale-98">
                Create Account
            </button>
        </form>

        <!-- Quick Demo Login Note -->
        <div class="mt-6 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-500">Demo Credentials: <span class="font-bold text-gray-700">demo_user</span> / <span class="font-bold text-gray-700">password123</span></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/firebase-auth.js') }}"></script>
<script>
function switchTab(mode) {
    const loginForm = document.getElementById('form-login');
    const regForm = document.getElementById('form-register');
    const tabLogin = document.getElementById('tab-login');
    const tabReg = document.getElementById('tab-register');

    if (mode === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-[#0F172A] text-[#0F172A] transition-colors';
        tabReg.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors';
    } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-[#0F172A] text-[#0F172A] transition-colors';
        tabLogin.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors';
    }
}
{% if mode == 'register' %}
switchTab('register');
{% endif %}
</script>
{% endblock %}
