{% extends "base.html" %}

{% block title %}Sign In - Stride{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="card-stride p-8 shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fa-solid fa-person-walking text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Welcome to Stride</h1>
            <p class="text-sm text-gray-500">Sign in to manage attendance, expenses & assignments</p>
        </div>

        <!-- Mode Tabs -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition-colors">
                Sign In
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors">
                Create Account
            </button>
        </div>

        <!-- Login Form -->
        <form id="form-login" action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required placeholder="demo_user" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-colors btn-transition">
                Sign In
            </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" action="{{ url_for('auth.register') }}" method="POST" class="space-y-5 hidden">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required placeholder="john_doe" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" name="email" required placeholder="john@example.com" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition-all">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-colors btn-transition">
                Create Account
            </button>
        </form>

        <!-- Quick Demo Login Note -->
        <div class="mt-6 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-500">Demo Credentials: <span class="font-bold text-gray-700">demo_user</span> / <span class="font-bold text-gray-700">password123</span></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function switchTab(mode) {
    const loginForm = document.getElementById('form-login');
    const regForm = document.getElementById('form-register');
    const tabLogin = document.getElementById('tab-login');
    const tabReg = document.getElementById('tab-register');

    if (mode === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition-colors';
        tabReg.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors';
    } else {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden');
        tabReg.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition-colors';
        tabLogin.className = 'w-1/2 py-3 text-center text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors';
    }
}
{% if mode == 'register' %}
switchTab('register');
{% endif %}
</script>
{% endblock %}
